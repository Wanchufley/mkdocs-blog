site_name: Wanchufley's Documentation 
site_url: https://wanchufley.github.io/mkdocs-blog
site_description: Personal documentation and configuration files
site_author: Wanchufley

theme:
  name: material
  custom_dir: ./docs/overrides/
  palette:
    - media: "(prefers-color-scheme)"
      scheme: slate
      primary: black
      accent: deep purple
      toggle:
        icon: material/brightness-4
        name: Switch to system preference
  features:
    - header.autohide
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - toc.follow
    - search.suggest
    - search.highlight
  icon:
    logo: material/alpha-w

extra:
  generator: false
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/Wanchufley

extra_css:
  - stylesheets/cards.css

nav:
  - 🏠 Home: index.md
  - 👤 About: about.md
  - 🏷️ Tags: tags.md 
  - 📁 Files: file-explorer.md 
#  - 🤝 Sponsor: sponsor.md

plugins:
  - search:
      separator: '[\s\-,:!=\[\]()"/]+|(?!\b)(?=[A-Z][a-z])|\.(?!\d)|&[lg]t;'
#  - blog:
#      blog_dir: .
#      categories_allowed:
#      - Tech
#      post_url_format: "{slug}"
#      blog_toc: true
#      archive: false
#      index_page: false
  - tags:
      tags_file: tags.md

markdown_extensions:
  - attr_list
  - md_in_html
  - def_list
  - footnotes
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - admonition
  - pymdownx.details
  - toc:
      permalink: true
      toc_depth: 3
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.smartsymbols
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde

