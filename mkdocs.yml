site_name: Wanchufley's Documentation 
site_url: https://wanchufley.github.io/mkdocs-blog
theme:
  name: material
  custom_dir: ./docs/overrides/
  palette:
    - media: "(prefers-color-scheme)"
      scheme: slate
      primary: black
      accent: deep purple
      toggle:
        icon: material/brightness-4
        name: Switch to system preference
  features:
    - header.autohide
    - navigation.instant
  icon:
    logo: material/alpha-w

extra:
  generator: false

extra_css:
  - stylesheets/cards.css

nav:
  - 🏠 Home: index.md
  - 👤 About: about.md
  - 🏷️ Tags: tags.md 
  -  Files: file-explorer.md 
#  - 🤝 Sponsor: sponsor.md

plugins:
  - search
#  - blog:
#      blog_dir: .
#      categories_allowed:
#      - Tech
#      post_url_format: "{slug}"
#      blog_toc: true
#      archive: false
#      index_page: false
  - tags:
      tags_file: tags.md
markdown_extensions:
  - attr_list
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
  - pymdownx.highlight:
      use_pygments: true
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - admonition
  - pymdownx.details
  - toc:
      permalink: true
  - pymdownx.tabbed:
     alternate_style: true
  - pymdownx.emoji
  - pymdownx.highlight
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.smartsymbols
  - pymdownx.tasklist
  - pymdownx.tilde

